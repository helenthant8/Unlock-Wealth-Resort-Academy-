<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>အကောင့်ဝင်ရန် - Unlock Wealth Resort</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono&family=Noto+Sans+Myanmar:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Noto Sans Myanmar', 'Inter', sans-serif; 
            background: linear-gradient(90deg, rgba(191, 227, 179, 1) 0%, rgba(247, 250, 249, 1) 49%, rgba(190, 227, 129, 1) 100%);
            background-size: 200% 200%;
            animation: waterFlow 12s ease infinite;
            color: #1e293b; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        @keyframes waterFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .mono { font-family: 'JetBrains Mono', monospace; }
        
        .glass { 
            background: rgba(255, 255, 255, 0.5); 
            backdrop-filter: blur(16px); 
            border: 1px solid rgba(255, 255, 255, 0.8); 
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
        }
        
        .input-glass {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }
        .input-glass:focus {
            outline: none;
            border-color: #16a34a;
            box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.2);
        }

        .green-glow { box-shadow: 0 0 20px rgba(34, 197, 94, 0.4); }
    </style>
</head>
<body class="antialiased">

    <audio id="waterSound" loop>
        <source src="https://assets.mixkit.co/active_storage/sfx/2515/2515-preview.mp3" type="audio/mpeg">
    </audio>

    <header class="w-full glass border-b border-black/5">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="my.html" class="flex items-center gap-3">
                <img src="https://i.imgur.com/your-logo-placeholder.png" alt="Logo" class="w-10 h-10 object-contain"> 
                <span class="font-bold tracking-tighter text-lg uppercase italic hidden sm:block text-slate-800">Unlock Wealth Resort</span>
            </a>
            
            <div class="flex items-center gap-6">
                <button id="soundToggle" class="text-slate-600 hover:text-green-600 transition-colors focus:outline-none" onclick="toggleSound()" title="Play/Pause Water Sounds">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072M18.364 5.636a9 9 0 010 12.728M12 18.w-6 h-6a8 8 0 01-8-8V4a2 2 0 012-2h4l4 4h4a2 2 0 012 2v10a8 8 0 01-8 8z"></path></svg>
                </button>

                <div class="relative group">
                    <button class="flex items-center gap-1 text-sm font-semibold text-slate-800 hover:text-green-600 transition-colors focus:outline-none">
                        🌐 MY 
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                    <div class="absolute right-0 mt-2 w-36 bg-white border border-slate-200 rounded-lg shadow-xl opacity-0 group-hover:opacity-100 invisible group-hover:visible transition-all duration-200 z-50 overflow-hidden">
                        <a href="login.html" class="block px-4 py-2 text-sm text-slate-600 hover:bg-slate-50 hover:text-green-600 transition-colors"> English</a>
                        <a href="login-my.html" class="block px-4 py-2 text-sm text-green-600 bg-green-50 hover:bg-green-100 transition-colors font-bold"> မြန်မာ</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center px-6 py-12 relative overflow-hidden">
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-white/40 blur-[100px] rounded-full pointer-events-none"></div>
        
        <div class="glass w-full max-w-md rounded-3xl p-10 relative z-10">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-slate-800 mb-2">ပြန်လည်ကြိုဆိုပါသည်</h1>
                <p class="text-slate-600 text-sm font-medium">သင့်ခရီးစဉ်ကို ဆက်လက်လုပ်ဆောင်ရန် သင့်ခိုလှုံရာသို့ ဝင်ရောက်ပါ။</p>
            </div>

            <form action="dashboard-my.html" method="GET" class="space-y-6">
                <div>
                    <label for="email" class="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-2">အီးမေးလ်လိပ်စာ</label>
                    <input type="email" id="email" class="input-glass w-full px-4 py-3 rounded-xl text-slate-800 transition-all font-medium" placeholder="သင့်အီးမေးလ်ကို ထည့်ပါ" required>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label for="password" class="block text-xs font-bold text-slate-700 uppercase tracking-wide">စကားဝှက်</label>
                        <a href="#" class="text-xs text-green-600 hover:text-green-700 font-bold">စကားဝှက်မေ့နေပါသလား?</a>
                    </div>
                    <input type="password" id="password" class="input-glass w-full px-4 py-3 rounded-xl text-slate-800 transition-all font-medium" placeholder="သင့်စကားဝှက်ကို ထည့်ပါ" required>
                </div>

                <div class="flex items-center">
                    <input type="checkbox" id="remember" class="w-4 h-4 text-green-600 bg-white border-slate-300 rounded focus:ring-green-500">
                    <label for="remember" class="ml-2 text-sm text-slate-600 font-medium">ရက် ၃၀ ကြာ မှတ်ထားပါ</label>
                </div>

                <button type="submit" class="w-full bg-green-600 text-white px-5 py-4 rounded-xl font-bold hover:bg-green-500 transition-all green-glow shadow-lg text-sm tracking-wide">
                    အကောင့်ဝင်ရန်
                </button>
            </form>

            <div class="mt-8 text-center border-t border-slate-300/50 pt-6">
                <p class="text-sm text-slate-600 font-medium">
                    အကောင့်မရှိသေးဘူးလား? 
                    <a href="my.html" class="text-green-600 font-bold hover:underline">ယခုစာရင်းသွင်းရန်</a>
                </p>
            </div>
        </div>
    </main>

    <footer class="py-6 text-center text-slate-600 text-[10px] mono tracking-widest uppercase font-bold relative z-10">
        © ၂၀၂၆ Unlock Wealth Resort Academy @Helen Thant
    </footer>

    <script>
        const audio = document.getElementById("waterSound");
        const btn = document.getElementById("soundToggle");
        let isPlaying = false;

        function toggleSound() {
            if (isPlaying) {
                audio.pause();
                btn.classList.remove("text-blue-500");
                btn.classList.add("text-slate-600");
            } else {
                audio.volume = 0.4; 
                audio.play();
                btn.classList.remove("text-slate-600");
                btn.classList.add("text-blue-500"); 
            }
            isPlaying = !isPlaying;
        }
    </script>
</body>
</html>
