<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Unlock Wealth Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .input-glow:focus { outline: none; border-color: #22c55e; box-shadow: 0 0 15px rgba(34, 197, 94, 0.2); }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex items-center justify-center px-6">

    <div class="fixed top-0 left-1/2 -translate-x-1/2 w-full h-[500px] bg-green-500/10 blur-[120px] rounded-full -z-10"></div>

    <div class="w-full max-w-md">
        <a href="index.html" class="text-xs font-bold text-slate-500 hover:text-green-400 mb-8 inline-block tracking-widest uppercase mono">
            ← Back to Sanctuary / ပင်မစာမျက်နှာသို့
        </a>
        
        <div class="glass p-10 rounded-[2.5rem] border border-white/5">
            <div class="text-center mb-10">
                <div class="w-16 h-16 bg-gradient-to-tr from-green-400 to-emerald-600 rounded-2xl mx-auto mb-6 flex items-center justify-center shadow-lg shadow-green-500/20">
                    <span class="text-black font-black text-2xl italic">U</span>
                </div>
                <h1 class="text-3xl font-bold mb-2">Member Portal</h1>
                <p class="text-slate-400 text-xs font-medium uppercase tracking-tighter">အဖွဲ့ဝင်ဝင်ရောက်ရန်</p>
            </div>

            <form class="space-y-6">
                <div>
                    <label class="flex justify-between text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">
                        <span>Access ID</span>
                        <span class="text-green-600/60 font-medium">အသုံးပြုသူအမည်</span>
                    </label>
                    <input type="email" placeholder="email@example.com" class="w-full bg-slate-900/50 border border-white/10 rounded-xl px-5 py-4 text-sm input-glow transition-all">
                </div>

                <div>
                    <label class="flex justify-between text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">
                        <span>Security Key</span>
                        <span class="text-green-600/60 font-medium">လုံခြုံရေးကုဒ်</span>
                    </label>
                    <input type="password" placeholder="••••••••" class="w-full bg-slate-900/50 border border-white/10 rounded-xl px-5 py-4 text-sm input-glow transition-all">
                </div>
                
                <button type="button" class="w-full bg-green-500 text-black font-black py-4 rounded-xl hover:bg-green-400 transition-all shadow-lg shadow-green-500/10 flex flex-col items-center">
                    <span class="text-sm">AUTHORIZE ACCESS</span>
                    <span class="text-[10px] opacity-70">ဝင်ရောက်ခွင့် အတည်ပြုရန်</span>
                </button>
            </form>

            <div class="mt-8 text-center">
                <p class="text-xs text-slate-500">
                    No account? / အကောင့်မရှိသေးပါက <br/>
                    <a href="mailto:yourbrand@gmail.com" class="text-green-400 hover:underline">Request Membership / အဖွဲ့ဝင်ခွင့်တောင်းခံပါ</a>
                </p>
            </div>
        </div>

        <footer class="mt-10 text-center opacity-30 text-[9px] mono tracking-widest uppercase">
            Encrypted Connection Established // 2026 Protocol
        </footer>
    </div>

</body>
</html>
